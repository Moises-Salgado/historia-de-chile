# Publica la carpeta site/ en GitHub Pages en cada push a main.
name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Versión sin conexión (ítem 2.14 del debate): ZIP del sitio en la publicación «sin-conexion».
  # Se descomprime y se abre index.html: funciona sin internet (los colegios con mala conexión).
  sin-conexion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar site/
        run: cd site && zip -qr ../historia-de-chile.zip . -x "sw.js"
      - name: Subir el ZIP a la publicación «sin-conexion»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sin-conexion >/dev/null 2>&1 || gh release create sin-conexion --title "Historia de Chile sin conexión" --notes "Descarga historia-de-chile.zip, descomprímelo y abre index.html con doble clic. Funciona sin internet. Se actualiza con cada cambio del sitio."
          gh release upload sin-conexion historia-de-chile.zip --clobber
